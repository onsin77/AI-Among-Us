# AIAmongUs Agent 配置模板(UTF-8)
# 用法: 复制为 config.ini 再填入自己的凭据(config.ini 已被 .gitignore 排除,绝不入库)。
# 凭据也可用环境变量覆盖: DEEPSEEK_API_KEY / XF_APP_ID / XF_API_KEY / XF_API_SECRET。
# 缺失 config.ini 时程序以全默认值启动(无凭据则模型/语音功能自动降级)。

[bridge]
host = 127.0.0.1
port = 47600

[web]
host = 127.0.0.1
port = 8765

[deepseek]
api_key = <你的 DeepSeek sk- 开头 key>
base_url = https://api.deepseek.com
fast_model = deepseek-chat
deep_model = deepseek-reasoner

[behavior]
# monitor=只观察 | crew=好人自动任务/报尸 | impostor=坏人巡逻击杀(永不报警) | auto=按角色
mode = monitor
tick = 0.6
# 自动技能开关(true=13 个高置信技能自动使用)
# auto_abilities = true

[meeting]
enabled = true
# 会议输入(大家发言的 JSONL 文件);输出复盘文件
chat_file = data/meeting_chat.jsonl
out_file = data/meeting_out.jsonl
model_tier = fast
min_interval = 6.0

[startup]
# none|freeplay
autostart = none
map = 4

[voice]
# 语音会议总开关;设备名只要子串匹配即可(WASAPI 优先,自动回退)
enabled = true
capture_device = CABLE Output
play_device = CABLE Input
# 发言静默多久算说完(轮到下一位)/轮到某人多久没开口就跳过
turn_end_gap = 3.5
turn_timeout = 30
# 语音发言是否同时发游戏内文字聊天
also_chat_in_game = false
out_file = data/voice_out.jsonl

[asr]
# 科大讯飞 RTASR-LLM(实时语音转写+音色分离)控制台 https://console.xfyun.cn
app_id = <讯飞 app_id>
api_key = <讯飞 api_key>
api_secret = <讯飞 api_secret>
lang = autodialect

[tts]
# 本地 XTTS 服务(D:\ai\xtts),启动:双击 service\start.bat
base_url = http://127.0.0.1:17895
voice = xiaoyan
speed = 55
volume = 60

[memory]
# 自优化记忆:跨局经验 + 玩家印象
dir = data/memory
inject_last = 5

[session]
# 整局托管:local|online|freeplay;bots=大厅补的假人数;min_players=开局人数
enabled = false
host_kind = local
map = 4
bots = 0
min_players = 4
auto_start = true
auto_next = true
max_games = 0
max_meetings = 0
bot_turn_timeout = 7
