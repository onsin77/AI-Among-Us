# AIAmongUs Agent 配置(UTF-8)
# DeepSeek key 也可用环境变量 DEEPSEEK_API_KEY 覆盖,不要硬编码提交到任何仓库

[bridge]
host = 127.0.0.1
port = 47600

[web]
host = 127.0.0.1
port = 8765

[deepseek]
api_key = sk-8b96c150aa1b4705bbb64da9eff11561
base_url = https://api.deepseek.com
fast_model = deepseek-chat
deep_model = deepseek-reasoner

[behavior]
# monitor=只观察 | crew=好人自动任务/报尸 | impostor=坏人巡逻击杀(永不报警) | auto=按角色
mode = monitor
tick = 0.6

[meeting]
enabled = true
# 会议输入(大家发言的 JSONL 文件);输出复盘文件
chat_file = data/meeting_chat.jsonl
out_file = data/meeting_out.jsonl
model_tier = fast
min_interval = 6.0

[startup]
# none|freeplay
autostart = none
map = 4

[voice]
# 语音会议总开关;设备名只要子串匹配即可(WASAPI 优先,自动回退)
enabled = true
capture_device = CABLE Output
play_device = CABLE Input
# 发言静默多久算说完(轮到下一位)/轮到某人多久没开口就跳过
turn_end_gap = 3.5
turn_timeout = 30
# 语音发言是否同时发游戏内文字聊天
also_chat_in_game = false
out_file = data/voice_out.jsonl

[asr]
# 科大讯飞 RTASR-LLM(实时语音转写+音色分离),仅本机使用,勿提交仓库
app_id = b1fd0d65
api_key = 7dab4ad810d56fa781132d28b442ff50
api_secret = ZGM5MWYyZmExMjcwZjM5ZWNlMWE2MGUy
lang = autodialect

[tts]
# 本地 XTTS 服务(D:\ai\xtts),启动:双击 service\start.bat
base_url = http://127.0.0.1:17895
voice = xiaoyan
speed = 55
volume = 60

[memory]
# 自优化记忆:跨局经验 + 玩家印象
dir = data/memory
inject_last = 5

[session]
# 整局托管:local|online|freeplay;bots=大厅补的假人数;min_players=开局人数
enabled = false
host_kind = local
map = 4
bots = 0
min_players = 4
auto_start = true
auto_next = true
max_games = 0
max_meetings = 0
bot_turn_timeout = 7
